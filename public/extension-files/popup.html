<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      margin: 0;
    }
    .icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .page-info {
      background: #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 12px;
    }
    .page-title {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .page-url {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }
    .clip-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
    }
    .clip-btn:hover {
      opacity: 0.9;
    }
    .clip-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .status {
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .preview {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
    }
    .preview.show {
      display: block;
    }
    .preview pre {
      font-size: 11px;
      white-space: pre-wrap;
      color: #cbd5e1;
      font-family: 'SF Mono', 'Fira Code', monospace;
      line-height: 1.5;
      margin: 0;
    }
    .copy-btn {
      width: 100%;
      padding: 8px;
      border: 1px solid #475569;
      border-radius: 6px;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .copy-btn:hover {
      background: #334155;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">📋</div>
    <h1>Web Clipper</h1>
  </div>
  
  <div class="page-info">
    <div class="page-title" id="page-title">Loading...</div>
    <div class="page-url" id="page-url">...</div>
  </div>
  
  <button class="clip-btn" id="clip-btn">📋 Clip This Page</button>
  
  <div class="status" id="status"></div>
  
  <div class="preview" id="preview">
    <pre id="markdown-output"></pre>
  </div>
  
  <button class="copy-btn" id="copy-btn" style="display:none">📋 Copy Markdown</button>
  
  <script src="popup.js"></script>
</body>
</html>
