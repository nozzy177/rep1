<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Clipper</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      padding: 0;
    }
    
    .container {
      background: white;
      margin: 10px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
    }
    
    .page-info {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 4px solid #667eea;
    }
    
    .page-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      word-wrap: break-word;
    }
    
    .page-url {
      font-size: 11px;
      color: #666;
      word-break: break-all;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn-secondary {
      background: #f8f9fa;
      color: #333;
      border: 1px solid #dee2e6;
    }
    
    .btn-secondary:hover {
      background: #e9ecef;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
    }
    
    .status.show {
      display: block;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .markdown-preview {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-wrap: break-word;
      display: none;
    }
    
    .markdown-preview.show {
      display: block;
    }
    
    .tabs {
      display: flex;
      border-bottom: 2px solid #dee2e6;
      margin-bottom: 15px;
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.3s ease;
    }
    
    .tab.active {
      color: #667eea;
      border-bottom: 2px solid #667eea;
      margin-bottom: -2px;
    }
    
    .tab-content {
      display: none;
    }
    
    .tab-content.active {
      display: block;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #333;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #dee2e6;
      border-radius: 6px;
      font-size: 13px;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    
    .checkbox-group {
      margin-bottom: 10px;
    }
    
    .checkbox-group label {
      display: flex;
      align-items: center;
      font-size: 13px;
      cursor: pointer;
    }
    
    .checkbox-group input {
      margin-right: 8px;
    }
    
    .footer {
      text-align: center;
      padding: 15px;
      font-size: 11px;
      color: #999;
      border-top: 1px solid #dee2e6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Web Clipper</h1>
      <p>Clip pages to Markdown</p>
    </div>
    
    <div class="content">
      <div class="tabs">
        <div class="tab active" data-tab="clipper">Clipper</div>
        <div class="tab" data-tab="settings">Settings</div>
      </div>
      
      <div class="tab-content active" id="tab-clipper">
        <div class="page-info">
          <div class="page-title" id="page-title">Loading...</div>
          <div class="page-url" id="page-url">...</div>
        </div>
        
        <button class="btn btn-primary" id="clip-btn">📋 Clip This Page</button>
        
        <div class="status" id="status"></div>
        
        <div class="markdown-preview" id="markdown-preview"></div>
        
        <button class="btn btn-secondary" id="copy-btn" style="display:none;">📋 Copy Markdown</button>
      </div>
      
      <div class="tab-content" id="tab-settings">
        <div class="form-group">
          <label>API URL</label>
          <input type="url" id="api-url" placeholder="https://your-api.com/endpoint">
        </div>
        
        <div class="form-group">
          <label>API Key (optional)</label>
          <input type="text" id="api-key" placeholder="Your API key">
        </div>
        
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="include-title" checked>
            Include title
          </label>
        </div>
        
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="include-url" checked>
            Include URL
          </label>
        </div>
        
        <div class="checkbox-group">
          <label>
            <input type="checkbox" id="include-date" checked>
            Include date
          </label>
        </div>
        
        <button class="btn btn-primary" id="save-settings-btn">💾 Save Settings</button>
      </div>
    </div>
    
    <div class="footer">
      Web Clipper v1.0
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
